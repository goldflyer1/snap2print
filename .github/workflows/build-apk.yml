name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests and build the APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Snap2Print-0.2.${{ github.run_number }}.apk"

      - name: Keep APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snap2Print-APK
          path: dist/*.apk

      - name: Publish as a GitHub release (download this on your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: Snap2Print 0.2.${{ github.run_number }}
          body: |
            Install on Android: open this page on your phone, tap the .apk below, and allow "Install unknown apps" for your browser when asked.
            Built from ${{ github.sha }}.
          files: dist/*.apk
